<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Outdoors | Pixel-Perfect Rebuild</title>
  
  <link rel="preload" href="images/hero-bg.avif" as="image" type="image/avif">
  <link rel="preload" href="fonts/playfair-display.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* OPTIMIZATION 2: System Font Stack Fallback */
    :root {
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Open Sans', system-ui, sans-serif;
      --bg-dark: #0A0A0A; /* Lebih 'deep' dari pure black */
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
    }
    
    body {
      margin: 0; background-color: var(--bg-dark);
      color: var(--text-main); font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased; /* Anti-aliasing wajib */
    }

    /* Hero Section (Pixel-Perfect with Aspect Ratio) */
    .hero {
      height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(10,10,10,0.5) 0%, rgba(10,10,10,1) 100%),
                  url('images/hero-bg.avif') no-repeat center center/cover;
      padding: 40px 10%; /* Sesuai padding di gambar */
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to content</a>

  <header>
    <nav aria-label="Main Navigation">
      <div class="nav-left">
        <a href="#about">ABOUT</a>
        <a href="#explore">EXPLORE</a>
      </div>
      <div class="nav-logo" aria-hidden="true">
        <svg>...</svg>
      </div>
      <div class="nav-right">
        <a href="#journal">JOURNAL</a>
        <a href="#search" aria-label="Search Site">
          <svg>...</svg> </a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    
    <section class="hero-text">
      <h1 class="font-serif">The Great Outdoors</h1>
      <p>Wander often. Wonder always.</p>
      <button class="play-btn" aria-label="Play video background">
        <svg>...</svg> </button>
    </section>

    <section class="explore" id="explore">
      <h2>Explore the World</h2>
      <p class="section-desc">We seek to provide...</p>

      <div class="card-grid">
        <div class="card">
          <img src="images/norway.avif" alt="Misty fjords of Norway" loading="lazy">
          <div class="card-overlay">
            <h3>Nærøyfjorden</h3>
            <p>NORWAY</p>
          </div>
        </div>
        </div>
    </section>

    <section class="journal" id="journal">
      <h2>The Journal</h2>
      
      <article class="journal-card">
        <img src="images/yosemite.avif" alt="Motorcyclist riding towards mountains in Yosemite" loading="lazy">
        <div class="journal-content">
          <time datetime="2017-05-30">MAY 30, 2017</time>
          <h3>An Unforgettable</h3>
          <p>If you only have one day...</p>
        </div>
      </article>
      </section>
  </main>

  <footer>
    <p>&copy; 2017 THE GREAT OUTDOORS. All rights reserved.</p>
    </footer>

</body>
</html>
