version: '3.8'
services:
  app:
    image: php:8.3-fpm
    volumes:
      - .:/app
    networks:
      - app-network
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: Karab412
      MYSQL_DATABASE: db_pos
    networks:
      - app-network
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
  ai_service:
    build: 
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./ml:/app
    networks:
      - app-network
networks:
  app-network:
    driver: bridge